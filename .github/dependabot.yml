# Dependency-update alerts, closing the "no automated vulnerability alerting
# path" gap in docs/security-review.md.
#
# Requires Dependabot to be enabled on the GHES instance - this file is inert,
# not an error, if it is not. Check Security > Dependabot settings.
#
# The 7-day cooldown is the point, not a courtesy: a release published minutes
# ago is the likeliest to be a compromised one. It matches `exclude-newer` in
# pyproject.toml, `min-release-age` in every tools/playground-wasm/*/.npmrc,
# and is zizmor's minimum -- one number across every dependency manager here.
#
# Cooldown covers automated bumps. The .npmrc / exclude-newer settings cover a
# human resolving versions by hand. Both are needed: neither sees the other's
# entry point.
version: 2
updates:
  # "uv", not "pip": uv.lock is what the release wheel is built from
  # (uv sync --locked), and "pip" would read pyproject.toml without updating
  # the lock. Fall back to "pip" if this instance rejects the newer ecosystem.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # The five CI-only npm packages under tools/playground-wasm/. Each is its own
  # project with its own lockfile, and dependabot only looks where it is told --
  # a stage added without an entry here is silently unwatched, which is what
  # tests/test_playground_layout.py::test_every_npm_package_is_watched_by_dependabot
  # exists to catch.
  #
  # These never ship: they drive and test the WASM playground builds (see
  # .github/workflows/wasm-html.yaml) and nothing here reaches the published
  # wheel. They are still worth watching -- a compromised build-time dependency
  # can alter the artifact CI publishes, which is the whole point of a
  # build-chain attack.

  # jco + esbuild + preview2-shim: builds the component into a browser bundle
  - package-ecosystem: "npm"
    directory: "/tools/playground-wasm/componentize-py/smoke"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # jco's transpiler targets one preview2-shim minor and the generated glue
    # imports the top-level shim, so the two must move together. Separate PRs
    # for them once left this lockfile inconsistent (#89, #90), and let the shim
    # run ahead of what jco targets.
    groups:
      bytecodealliance:
        patterns:
          - "@bytecodealliance/*"
    # The group still moves each package to its own latest, and the latest
    # jco can target an older shim minor than the latest shim (#92 and #93 did
    # exactly that). So the shim gets patch updates only: a new minor lands
    # when a jco that targets it does, bumped by hand in that jco PR, where
    # tests/test_vscode_extension_layout.py fails until both agree. Major is
    # ignored too, since a 0.x minor is already a breaking change.
    ignore:
      - dependency-name: "@bytecodealliance/preview2-shim"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependencies"

  # playwright
  - package-ecosystem: "npm"
    directory: "/tools/playground-wasm/componentize-py/browser-test"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # the pinned pyodide release
  - package-ecosystem: "npm"
    directory: "/tools/playground-wasm/pyodide/smoke"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # playwright
  - package-ecosystem: "npm"
    directory: "/tools/playground-wasm/pyodide/browser-test"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # playwright; compares both built pages byte-for-byte
  - package-ecosystem: "npm"
    directory: "/tools/playground-wasm/parity-test"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # The VS Code extension proofs of concept under tools/vscode-extension/ (issue
  # #10). Unlike the playground packages above, this one ships to users once an
  # extension is packaged, so a compromised dependency would run in their
  # editor. tests/test_vscode_extension_layout.py holds an entry here for each.

  # vscode-languageclient, vscode-jsonrpc, preview2-shim; jco (build only)
  - package-ecosystem: "npm"
    directory: "/tools/vscode-extension/componentize-py"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # jco's transpiler targets one preview2-shim minor and the generated glue
    # imports the top-level shim, so the two must move together. Separate PRs
    # for them once left this lockfile inconsistent (#89, #90), and let the shim
    # run ahead of what jco targets.
    groups:
      bytecodealliance:
        patterns:
          - "@bytecodealliance/*"
    # The group still moves each package to its own latest, and the latest
    # jco can target an older shim minor than the latest shim (#92 and #93 did
    # exactly that). So the shim gets patch updates only: a new minor lands
    # when a jco that targets it does, bumped by hand in that jco PR, where
    # tests/test_vscode_extension_layout.py fails until both agree. Major is
    # ignored too, since a 0.x minor is already a breaking change.
    ignore:
      - dependency-name: "@bytecodealliance/preview2-shim"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "dependencies"

  # @vscode/test-electron: the shared end-to-end smoke test
  - package-ecosystem: "npm"
    directory: "/tools/vscode-extension/common/smoke"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # vscode-languageclient
  - package-ecosystem: "npm"
    directory: "/tools/vscode-extension/python-stdio"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # Scans .pre-commit-config.yaml and updates each hook's `rev:` (SHA-pinned
  # revs get their version comment updated too, same as the github-actions
  # entries above). No `cooldown` here: as of 2026-03, GitHub does not support
  # the cooldown option for this ecosystem, so these PRs land without the
  # 7-day delay the other two ecosystems get - review before merging.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
