---
name: vscode-extension

# Builds "BigFix Relevance Developer" (tools/vscode-extension/componentize-py/)
# into an installable .vsix, uploads it as this run's artifact, and tests the
# packaged extension twice. Issue #10 has the background.
#
#   package  builds the language-server component from this checkout's wheel,
#            packages the .vsix with vsce, unit-tests the *unzipped* .vsix in
#            plain Node (seconds), then uploads it.
#   e2e      downloads that artifact and runs the shared smoke test in a real
#            VS Code (fetched by @vscode/test-electron), on Linux (headless,
#            under xvfb-run) and on Windows: the extension activates, starts its
#            server, and the diagnostics for its test files reach the editor.
#            The one .vsix is meant for every platform, and was packaged on
#            Linux, so Windows is where a platform-specific file would show.
#
# Both test what ships, not the source tree: the component lives under dist/,
# which is gitignored, and is in the .vsix only because .vscodeignore lets it
# through.
#
# To install the artifact: unzip the download, then in VS Code run
# "Extensions: Install from VSIX..." and pick the .vsix inside.
#
# Releases: tag_and_release.yaml calls this workflow with `release_artifact`,
# the same way it calls wasm-html.yaml for the playground page. Then `package`
# builds from the release's own wheel (verified against its SHA256SUMS.txt)
# instead of rebuilding one, and only the quick unit tests run: `e2e` is
# skipped so the headless VS Code job never holds up a release. The caller
# attaches the uploaded .vsix to the release.

# Runs only when something the extension is built from changes, so a docs-only
# PR skips the ~350 MB VS Code download. Keep this list complete: a missing input
# means its changes go untested here. If these checks are ever made required in
# branch protection, revisit this: a filtered-out workflow never reports.
on:
  pull_request:
    paths: &inputs
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tools/vscode-extension/**"
      - "tools/playground-wasm/componentize-py/build-playground/**"
      - ".github/workflows/vscode-extension.yaml"
  push:
    branches:
      - main
    paths: *inputs
  workflow_dispatch:
  # Called by tag_and_release.yaml while its release is still a draft; see the
  # header. Needs only read access: the caller attaches the .vsix.
  workflow_call:
    inputs:
      release_artifact:
        description: "Name of an artifact in the calling run holding the release's dist/ (wheel + SHA256SUMS.txt)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # github.workflow is the CALLER's name under workflow_call, so a release run
  # and this workflow's own push-to-main run land in different groups instead
  # of cancelling each other (the same arrangement as wasm-html.yaml).
  group: vscode-extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Same awk-from-.pre-commit-config.yaml trick as wasm-html.yaml, so this
      # workflow doesn't carry a second, driftable uv version pin.
      - name: read uv version from .pre-commit-config.yaml
        run: |
          UV_VERSION="$(awk '
            /^[[:space:]]*-[[:space:]]*repo:.*astral-sh\/uv-pre-commit[[:space:]]*$/ { found = 1; next }
            found && $1 == "rev:" {
              if (match($0, /#[ \t]*(frozen:[ \t]*)?[vV]?[0-9]+(\.[0-9]+)*/)) {
                ver = substr($0, RSTART, RLENGTH)
                sub(/^#[ \t]*(frozen:[ \t]*)?[vV]?/, "", ver)
              } else {
                ver = $2
                gsub(/["'"'"']/, "", ver)
                sub(/^[vV]/, "", ver)
              }
              print ver
              exit
            }
          ' .pre-commit-config.yaml)"
          if [ -z "$UV_VERSION" ]; then
            echo "::error::could not read the astral-sh/uv-pre-commit version from .pre-commit-config.yaml"
            exit 1
          fi
          echo "UV_VERSION=$UV_VERSION" >> "$GITHUB_ENV"
          echo "uv version: $UV_VERSION"

      - name: install uv
        run: python -m pip install "uv==${UV_VERSION}"

      # Node 22: @vscode/vsce 4 requires it. The npm it ships predates
      # `min-release-age`, which is fine for `npm ci` -- it installs the pinned
      # lockfile and has nothing to hold back (see the package's .npmrc).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/vscode-extension/componentize-py/package-lock.json

      - name: npm ci
        working-directory: tools/vscode-extension/componentize-py
        run: npm ci

      # A release run uses the exact wheel that release published (the same
      # dist/ that went to PyPI), checked against the SHA256SUMS.txt computed
      # alongside it -- as wasm-html.yaml does for the playground.
      - name: download the release's dist/
        if: inputs.release_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_artifact }}
          path: dist

      - name: verify the release's wheel
        if: inputs.release_artifact != ''
        run: |
          cd dist && sha256sum -c SHA256SUMS.txt

      # Wheel -> componentize-py (the playground's two-pass build) -> jco for
      # Node -> a smoke check that the component boots, reports the wheel's
      # version, and answers `initialize` -> `vsce package`, with the .vsix
      # versioned as that wheel: the extension's version is the analyzer's.
      # Outside a release the script builds its own wheel from this checkout.
      # `--group wasm` is what puts the pinned componentize-py on PATH.
      - name: build and package the extension
        env:
          RELEASE_ARTIFACT: ${{ inputs.release_artifact }}
        run: |
          wheel=()
          if [ -n "$RELEASE_ARTIFACT" ]; then
            # Quoted: build_component.py resolves the pattern and insists on
            # exactly one wheel, with a clear message otherwise.
            wheel=(--wheel 'dist/*.whl')
          fi
          uv run --group wasm python \
            tools/vscode-extension/componentize-py/build-component/build_component.py \
            "${wheel[@]}" \
            --package dist/vsix/bigfix-relevance-developer.vsix

      # Unzipped the way VS Code installs it: the extension is under extension/.
      - name: unzip the .vsix
        run: unzip -q dist/vsix/bigfix-relevance-developer.vsix -d dist/vsix-unpacked

      # The packaged files are all there, and the packaged server.js, with the
      # packaged component, answers LSP over Node IPC exactly as it will for
      # vscode-languageclient. No VS Code needed; a couple of seconds.
      - name: unit-test the packaged extension
        env:
          EXTENSION_DIR: ${{ github.workspace }}/dist/vsix-unpacked/extension
        # The file, not the directory: Node 22 runs a directory argument as a
        # module and fails with MODULE_NOT_FOUND (later Node versions expand it).
        run: node --test tools/vscode-extension/componentize-py/test/server.test.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bigfix-relevance-developer-vsix
          path: dist/vsix/bigfix-relevance-developer.vsix
          if-no-files-found: error

  e2e:
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      # A failure on one platform still reports the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Not for a release, deliberately: only the quick unit tests in `package`
    # gate a release, so a slow or flaky editor test cannot hold one up. The
    # same commit is still tested here, by the push-to-main run that the
    # version bump also triggers (pyproject.toml is one of this workflow's
    # paths), but the release does not wait for it. A break that only shows in
    # a real VS Code would reach that release.
    if: inputs.release_artifact == ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/vscode-extension/common/smoke/package-lock.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bigfix-relevance-developer-vsix
          path: dist/vsix

      # Python's zipfile rather than `unzip`, which not every runner has.
      - name: unzip the .vsix
        run: python -m zipfile -e dist/vsix/bigfix-relevance-developer.vsix dist/vsix-unpacked

      # @vscode/test-electron, pinned in this package, is what downloads and
      # launches VS Code. run.mjs explains how.
      - name: npm ci (smoke test)
        working-directory: tools/vscode-extension/common/smoke
        run: npm ci

      # VS Code is ~350 MB. The version is pinned as `vscodeVersion` in the
      # smoke package's package.json, so the key changes when it does.
      # test-electron checks a download against the update server's SHA-256;
      # a cache hit skips the download and so that check, which is the usual
      # trade for actions/cache (writable only by this repository's runs).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/vscode-extension/common/smoke/.vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('tools/vscode-extension/common/smoke/package.json') }}

      # On Linux, xvfb-run gives VS Code a display; a Windows runner has a
      # desktop already. run.mjs downloads VS Code (retrying a failed download)
      # on a cache miss, launches it against the unzipped .vsix, and prints the
      # result and how long it took. Its output goes to the step summary too;
      # `tee` keeps a failing exit code because `shell: bash` runs with
      # `bash -eo pipefail` (Git Bash on Windows).
      - name: smoke-test the packaged extension in VS Code
        shell: bash
        run: |
          display=()
          if [ "$RUNNER_OS" = Linux ]; then
            display=(xvfb-run -a)
          fi
          "${display[@]}" node tools/vscode-extension/common/smoke/run.mjs \
            dist/vsix-unpacked/extension \
            | tee -a "$GITHUB_STEP_SUMMARY"
