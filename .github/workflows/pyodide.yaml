---
name: pyodide

# Proves this package's wheel installs and runs under Pyodide (CPython
# compiled to WASM) inside Node -- with no system Python in the loop at all.
# That's the constraint a VS Code extension bundling this package would ship
# under (see issue #10: "could a VS Code extension use the python code
# directly rather than porting to Rust?"). This workflow answers only the
# build/runtime half of that question -- it does not implement or exercise
# any LSP surface, just import-and-run-one-example under the real target
# runtime. tools/pyodide-smoke/smoke.mjs is the script; see its header for
# what it checks and why.
#
# It also builds a standalone HTML playground (tools/pyodide-playground/)
# with the same analyzer embedded for interactive use in a browser, and
# uploads it as this run's "pyodide-playground" artifact.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyodide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyodide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pin as .github/workflows/test.yaml -- only used here to build
      # the wheel that gets handed to Pyodide, not to run the package.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Same awk-from-.pre-commit-config.yaml trick as test.yaml, so this
      # workflow doesn't carry a second, driftable uv version pin.
      - name: read uv version from .pre-commit-config.yaml
        run: |
          UV_VERSION="$(awk '
            /^[[:space:]]*-[[:space:]]*repo:.*astral-sh\/uv-pre-commit[[:space:]]*$/ { found = 1; next }
            found && $1 == "rev:" {
              if (match($0, /#[ \t]*(frozen:[ \t]*)?[vV]?[0-9]+(\.[0-9]+)*/)) {
                ver = substr($0, RSTART, RLENGTH)
                sub(/^#[ \t]*(frozen:[ \t]*)?[vV]?/, "", ver)
              } else {
                ver = $2
                gsub(/["'\'']/, "", ver)
                sub(/^[vV]/, "", ver)
              }
              print ver
              exit
            }
          ' .pre-commit-config.yaml)"
          if [ -z "$UV_VERSION" ]; then
            echo "::error::could not read the astral-sh/uv-pre-commit version from .pre-commit-config.yaml"
            exit 1
          fi
          echo "UV_VERSION=$UV_VERSION" >> "$GITHUB_ENV"
          echo "uv version: $UV_VERSION"

      - name: install uv
        run: python -m pip install "uv==${UV_VERSION}"

      # Only the wheel this step produces is what Pyodide gets -- not the
      # source tree -- so this exercises the same artifact a release ships,
      # same as the "install the built wheel" step in test.yaml.
      - name: uv build (wheel)
        run: uv build --wheel

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/pyodide-smoke/package-lock.json

      - name: npm ci
        working-directory: tools/pyodide-smoke
        run: npm ci

      # The version this checks against __version__ comes from the wheel's
      # own package metadata, same as the "smoke-import" step in test.yaml --
      # nothing here can drift from what was actually built.
      # smoke.mjs prints its report as plain Markdown on stdout and knows
      # nothing about CI -- `tee` is what puts it in both the job log and the
      # step summary, so that decision lives here, not in the script. The
      # default `bash --noprofile --norc -eo pipefail` shell GitHub Actions
      # runs `run:` steps with (docs: "Exit codes and error action
      # preferences") is what makes a non-zero exit from smoke.mjs still fail
      # this step despite the pipe into tee.
      - name: run the analyzer under Pyodide in Node
        working-directory: tools/pyodide-smoke
        run: node smoke.mjs ../../dist/*.whl | tee -a "$GITHUB_STEP_SUMMARY"

      # Precompiles the wheel's .py files to .pyc using this exact Pyodide
      # build's own CPython, rather than the runner's host Python -- see the
      # script's header for why that distinction matters (magic-number drift
      # between this workflow's pinned Python and whatever Pyodide bundles).
      # A real compile failure here fails this job instead of surfacing as a
      # confusing runtime failure for someone using the playground.
      - name: precompile the wheel's .pyc with Pyodide's own CPython
        working-directory: tools/pyodide-smoke
        run: node precompile_wheel.mjs --wheel ../../dist/*.whl --out ../../dist/precompiled.zip

      # tools/pyodide-smoke's npm ci above already fetched the exact Pyodide
      # release this repo pins, as the "pyodide" npm package -- that package
      # ships its own runtime assets (the wasm binary, stdlib zip, etc.) for
      # its own offline/Node use, so this reads them from there instead of
      # fetching Pyodide's release a second time. build_playground.py checks
      # its own version pin against tools/pyodide-smoke/package.json's, so
      # the two can't silently drift apart.
      #
      # The built page is fully self-contained: everything Pyodide and this
      # package need is embedded as base64, so opening it makes no network
      # requests at all -- see template.html's boot() for how. That's also
      # why this step is the slow one: encoding ~13 MiB of runtime assets as
      # base64 is real work, not just a wheel copy.
      - name: build the standalone playground page
        run: |
          python3 tools/pyodide-playground/build_playground.py \
            --wheel dist/precompiled.zip \
            --pyodide-dir tools/pyodide-smoke/node_modules/pyodide \
            --out playground/bigfix-relevance-analyzer-playground.html

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bigfix-relevance-analyzer-html-playground
          path: playground/bigfix-relevance-analyzer-playground.html
          if-no-files-found: error
