---
# Tags and releases on a version bump. Nothing here bumps the version: the flow
# is to change `[project] version` in pyproject.toml in a PR, merge it to main,
# and this workflow does the rest (tag, build, checksums, GitHub Release, and -
# once deliberately enabled - PyPI, see the publish step, and the VS Code
# Marketplace, see the `marketplace` job).
name: Tag and Release

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/tag_and_release.yaml"
      - ".github/workflows/test.yaml"
      - ".github/workflows/wasm-html.yaml"
      - ".github/workflows/vscode-extension.yaml"
      - ".github/workflows/publish-vscode-extension.yaml"
  # a re-run path for when a release run failed after the version was already
  # merged; the tag check below still makes it a no-op if the tag exists
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One release at a time, repo-wide. Not keyed on github.ref: releases only
  # happen from main (see the `version` job), so a per-ref group would add
  # nothing but a way to overlap if that guard ever changed. Serializing also
  # keeps the tag check sound: a draft
  # has no tag until `finalize` publishes it, so a second run that started
  # mid-release would see no tag and try to release the same version again.
  # Deliberately no cancel-in-progress: never kill a release mid-flight.
  # GitHub keeps at most ONE pending run per group: a newer queued run
  # replaces an older queued one (never the running one). The newer run
  # releases whatever version its own commit has, so an intermediate bump
  # whose run got replaced is skipped, not released late.
  group: release

jobs:
  # Decides whether there is anything to do, so the expensive jobs below can be
  # skipped outright. A push that touches src/** without bumping the version
  # gets a green, near-instant run and no release.
  version:
    name: Check for an untagged version
    runs-on: ubuntu-latest
    # fork guard: a fork that pushes to its own main should not try to release.
    # main guard: `push` is already limited to main, but workflow_dispatch can
    # be started from any branch, and would release that branch's version.
    # Every later job needs this one, so skipping it skips the whole release.
    if: >-
      github.repository == 'jgstew/bigfix-relevance-analyzer'
      && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.getversion.outputs.version }}
      release_needed: ${{ steps.tagged.outputs.release_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history + tags: the tag check below needs every existing tag
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # `[project] version` in pyproject.toml is the single source of truth -
      # src/bigfix_relevance_analyzer/__init__.py reads __version__ back out of
      # the installed package metadata, so there is no second place to bump.
      # tomllib is stdlib on the 3.11+ this package requires, and the runner's
      # preinstalled python is new enough, so no setup-python step is needed.
      - name: Read version from pyproject.toml
        id: getversion
        run: |
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z.]+)?$'; then
            echo "::error::unexpected version string in pyproject.toml: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      # Release only if this version has no tag yet. This is what makes the
      # workflow idempotent and safe to re-run.
      - name: Check whether v<version> is already tagged
        id: tagged
        env:
          VERSION: ${{ steps.getversion.outputs.version }}
        run: |
          if git show-ref --tags --verify --quiet -- "refs/tags/v${VERSION}"; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already tagged - nothing to release"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} has no tag yet - will release"
          fi

  # The gates. Reusing the test and pre-commit workflows means the release is
  # blocked by the exact same jobs that guard PRs, with no third-party
  # wait-for-checks action and no polling. Both run in parallel off `version`
  # so a release is no slower than the slower of the two.
  #
  # The reusable-workflow calls in this file keep `./` and silence zizmor's
  # self-repository audit, which wants GitHub's newer `$/` syntax. actionlint
  # v1.7.12 rejects `$/` (rhysd/actionlint#711, #732). Switch to `$/` and drop
  # the ignores once an actionlint release supports it.
  test:
    name: Test
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    uses: ./.github/workflows/test.yaml # zizmor: ignore[self-repository]

  pre-commit:
    name: pre-commit
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    uses: ./.github/workflows/pre-commit.yaml # zizmor: ignore[self-repository]

  release:
    name: Tag and Release
    needs: [version, test, pre-commit]
    runs-on: ubuntu-latest
    # Deliberately gates the whole release - tag, GitHub release, and PyPI
    # upload - not just the publish step, so an environment protection rule
    # (required reviewer, wait timer, branch restriction) stops a release
    # before the tag is cut rather than after. The name must match the
    # `Environment name` field of the PyPI trusted publisher exactly: PyPI
    # checks the `environment` claim in the OIDC token, and a mismatch fails
    # the publish. Create it under Settings > Environments; an environment
    # with no protection rules is valid and simply records the deployment.
    environment: pypi
    permissions:
      # contents: write - create the tag and the release, and upload assets.
      # id-token: write - OIDC for the PyPI trusted-publishing step at the end
      # of this job. Both live here rather than in a separate publish job so
      # the built dist/ does not have to be handed between jobs through
      # upload-artifact/download-artifact.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # same awk-from-.pre-commit-config.yaml source of truth as
      # .github/workflows/test.yaml and pre-commit.yaml
      - name: read uv version from .pre-commit-config.yaml
        run: |
          UV_VERSION="$(awk '
            /^[[:space:]]*-[[:space:]]*repo:.*astral-sh\/uv-pre-commit[[:space:]]*$/ { found = 1; next }
            found && $1 == "rev:" {
              if (match($0, /#[ \t]*(frozen:[ \t]*)?[vV]?[0-9]+(\.[0-9]+)*/)) {
                ver = substr($0, RSTART, RLENGTH)
                sub(/^#[ \t]*(frozen:[ \t]*)?[vV]?/, "", ver)
              } else {
                ver = $2
                gsub(/["'\'']/, "", ver)
                sub(/^[vV]/, "", ver)
              }
              print ver
              exit
            }
          ' .pre-commit-config.yaml)"
          if [ -z "$UV_VERSION" ]; then
            echo "::error::could not read the astral-sh/uv-pre-commit version from .pre-commit-config.yaml"
            exit 1
          fi
          echo "UV_VERSION=$UV_VERSION" >> "$GITHUB_ENV"
          echo "uv version: $UV_VERSION"

      - name: install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: uv build (wheel + sdist)
        run: uv build

      # Checksums for dist/ only, used to verify the hand-off to the playground
      # build (wasm-html.yaml runs `sha256sum -c` against this). The release's
      # published SHA256SUMS.txt is computed later, in `finalize`, over every
      # asset including the ones built after this job.
      - name: Compute SHA-256 checksums for dist/
        working-directory: dist
        run: |
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Later jobs (the playground build, finalize) take dist/ from here rather
      # than from the release: a draft release is invisible to wasm-html.yaml's
      # read-only token, and this keeps every job on the exact same bytes.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

      # Created as a DRAFT and only published by `finalize`, once every asset
      # exists. That keeps this compatible with GitHub's immutable releases,
      # which lock a release's assets at publication. A draft does not create
      # its tag either: `--target` is recorded now, the tag appears on publish.
      # Using the gh CLI (preinstalled on the runner) also means one less
      # third-party action to pin, and no git push from this checkout.
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes "Draft: assets still being built." \
            dist/*.whl dist/*.tar.gz

      # Inert until all of these are true, so nothing can publish by accident:
      #   1. a PyPI trusted publisher exists for this repo with workflow name
      #      `tag_and_release.yaml` and environment name `pypi`, matching the
      #      `environment:` above (https://docs.pypi.org/trusted-publishers/)
      #   2. the repository variable PYPI_PUBLISH is set to `true`
      #      (Settings > Secrets and variables > Actions > Variables)
      #   3. whatever protection rules the `pypi` environment carries have been
      #      satisfied - those gate this entire job, tagging included
      # `uv publish` speaks OIDC natively given the id-token: write permission
      # above, so there is no long-lived API token to store and no
      # pypa/gh-action-pypi-publish pin to maintain.
      #
      # Deliberately here and not in `finalize`: PyPI goes live as early as
      # possible so the published package can be tried by hand (uvx) while the
      # playground is still building. The cost is that a later failure leaves
      # PyPI ahead of a still-draft GitHub release until it is re-run.
      - name: Publish to PyPI (trusted publishing)
        if: vars.PYPI_PUBLISH == 'true'
        # the explicit globs keep SHA256SUMS.txt (which lives in dist/ too) out
        # of the upload; uv publish would otherwise take everything in dist/
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz

  # Builds the componentize-py HTML playground from the release's wheel (via
  # the release-dist artifact). wasm-html.yaml stays read-only; its page comes
  # back as an artifact for `finalize` to attach.
  playground:
    name: Build HTML playground
    needs: release
    uses: ./.github/workflows/wasm-html.yaml # zizmor: ignore[self-repository]
    with:
      release_artifact: release-dist

  # Builds the "BigFix Relevance Developer" VS Code extension from the same
  # release wheel, in parallel with the playground. In release mode
  # vscode-extension.yaml runs only its quick unit tests (no headless VS Code),
  # so it does not hold the release up. Its .vsix comes back as an artifact
  # for `finalize` to attach.
  vscode-extension:
    name: Build VS Code extension
    needs: release
    uses: ./.github/workflows/vscode-extension.yaml # zizmor: ignore[self-repository]
    with:
      release_artifact: release-dist

  # Gathers every release asset into one directory, checksums all of them,
  # attaches whatever the draft does not have yet, and publishes. To add a new
  # release asset: build it in its own job, add that job to `needs` below, and
  # drop its file into assets/ in the gather step.
  # Re-running this job is safe: a draft's assets can be replaced (--clobber).
  # If a run fails before here, use "Re-run failed jobs" on that run: a fresh
  # run would see no tag (drafts have none) and try to create a second draft.
  #
  # Every asset job gates publishing, and PyPI went live in `release` before
  # any of them ran. So a failing playground or VS Code extension build (a
  # Dependabot lockfile mismatch breaking `npm ci`, say) leaves the package on
  # PyPI and the GitHub release as a draft until it is fixed and "Re-run failed
  # jobs" finishes it. That is the trade made for putting PyPI out early.
  finalize:
    name: Finalize and publish the release
    needs: [version, release, playground, vscode-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      # artifacts uploaded by a called workflow belong to this same run
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bigfix-relevance-analyzer-component-playground
          path: playground

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bigfix-relevance-developer-vsix
          path: vsix

      # Everything in assets/ is published and checksummed; nothing else is.
      # The component page takes the generic playground name: componentize-py
      # is the preferred runtime, so its page is THE playground.
      - name: Gather release assets
        run: |
          mkdir assets
          cp dist/*.whl dist/*.tar.gz assets/
          cp playground/bigfix-relevance-analyzer-component-playground.html \
             assets/bigfix-relevance-analyzer-playground.html
          cp vsix/bigfix-relevance-developer.vsix assets/
          ls -l assets

      # `sha256sum -c SHA256SUMS.txt`-verifiable, with no directory prefix, so
      # it checks out wherever the assets are downloaded to. Written outside
      # assets/ first so the file can never end up listing itself.
      - name: Compute SHA-256 checksums
        run: |
          (cd assets && sha256sum ./*) > "${RUNNER_TEMP}/SHA256SUMS.txt"
          mv "${RUNNER_TEMP}/SHA256SUMS.txt" assets/SHA256SUMS.txt
          cat assets/SHA256SUMS.txt

      # Release notes: GitHub's own generated notes (same content the Releases
      # UI would produce) with the checksums appended, so the hashes are
      # readable in the release body as well as downloadable as an asset. The
      # notes are built here instead of passing --generate-notes to `gh release
      # create` so the appended block is not at the mercy of how that flag
      # combines with --notes.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                --method POST \
                -f "tag_name=v${VERSION}" \
                -f "target_commitish=${GITHUB_SHA}" \
                --jq '.body' > "$notes_file"; then
            echo "::warning::could not generate release notes; falling back to a plain body"
            printf 'Release v%s\n' "${VERSION}" > "$notes_file"
          fi
          {
            printf '\n## SHA-256\n\n'
            # The backticks here are Markdown, not a command substitution: this
            # string is release-note body text, and single quotes are what keep
            # it literal. SC2016 cannot tell the two apart.
            # shellcheck disable=SC2016
            printf 'Verify with `sha256sum -c SHA256SUMS.txt`:\n\n'
            printf '```\n'
            cat assets/SHA256SUMS.txt
            printf '```\n'
          } >> "$notes_file"
          echo "NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
          cat "$notes_file"

      # Uploads every asset (--clobber makes the ones `release` already put on
      # the draft a harmless overwrite with identical bytes), then publishes.
      # Publishing is the last step and the point where the tag is created and,
      # with immutable releases on, everything is locked.
      - name: Upload assets and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release upload "v${VERSION}" --repo "$GITHUB_REPOSITORY" --clobber assets/*
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --notes-file "${NOTES_FILE}" \
            --draft=false

  # Publishes the released .vsix to the VS Code Marketplace. After `finalize`
  # on purpose, unlike PyPI: the Marketplace never accepts a version twice, so
  # it gets the extension only once the release it came from is public, and
  # publish-vscode-extension.yaml takes the .vsix from that published release
  # (verified against its SHA256SUMS.txt).
  #
  # Runs on every release, but only its final `vsce publish` step is gated, on
  # the repository variable VSCE_PUBLISH being `true`. Until then each release
  # still exercises everything up to that step (the release download and
  # checksum, Entra ID login, and `vsce verify-pat`), so the setup is proven
  # before anything goes to the Marketplace. If this job fails, the release is
  # already published; re-run it with "Re-run failed jobs", or run
  # publish-vscode-extension.yaml by hand with the version.
  marketplace:
    name: Publish VS Code extension
    needs: [version, finalize]
    permissions:
      # a called workflow gets at most what its caller job grants; id-token is
      # for the Entra ID (azure/login) OIDC exchange
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-vscode-extension.yaml # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.version.outputs.version }}

  # Asks jgstew/jgstew.github.io to pick up the playground from the release
  # that just went public. That repo's own workflow does the work: it downloads
  # the asset from the public release, verifies it against SHA256SUMS.txt, and
  # commits it with its own GITHUB_TOKEN. All this job does is start that run,
  # so SITE_DISPATCH_TOKEN needs only a fine-grained PAT with "Actions: Read
  # and write" on that one repository - it cannot push content.
  #
  # Needs the secret SITE_DISPATCH_TOKEN. Without it this job succeeds without
  # dispatching, and the site's weekly schedule picks the release up instead.
  # After `finalize` so the version is already public when the site fetches it.
  # If dispatching fails the release is unaffected: re-run this job with "Re-run
  # failed jobs", or run the site's workflow by hand.
  notify-site:
    name: Ask jgstew.github.io to pick up the release
    needs: [version, finalize]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch update-bigfix-relevance-analyzer-playground.yaml
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set - not dispatching; the site's weekly schedule will pick up v${VERSION}"
            exit 0
          fi
          # the exact version, not "latest", so a newer release cannot race this one
          gh workflow run update-bigfix-relevance-analyzer-playground.yaml \
            --repo jgstew/jgstew.github.io --ref master \
            -f "version=${VERSION}"
