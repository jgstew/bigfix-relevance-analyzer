---
name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # so .github/workflows/tag_and_release.yaml can gate a release on this exact
  # job rather than polling for other checks to go green
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Single bump point for the version this package is tested against; keep
      # it in step with the `classifiers` list in pyproject.toml. Pinned rather
      # than "3" so a new CPython release does not silently change what CI runs.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # single source of truth for the uv version: the `rev` of the
      # astral-sh/uv-pre-commit repo in .pre-commit-config.yaml, which
      # `pre-commit autoupdate` already keeps current. Read with awk rather
      # than a yaml parser so it needs nothing installed first. `rev` is
      # SHA-pinned (Dependabot's pre-commit ecosystem keeps the trailing
      # `# X.Y.Z` comment in sync when it bumps the SHA - same convention as
      # the actions/* pins above), so the version comes from that comment;
      # fall back to the bare `rev` value for a tag-pinned rev with no
      # comment. Same step as in .github/workflows/pre-commit.yaml.
      - name: read uv version from .pre-commit-config.yaml
        run: |
          UV_VERSION="$(awk '
            /^[[:space:]]*-[[:space:]]*repo:.*astral-sh\/uv-pre-commit[[:space:]]*$/ { found = 1; next }
            found && $1 == "rev:" {
              if (match($0, /#[ \t]*(frozen:[ \t]*)?[vV]?[0-9]+(\.[0-9]+)*/)) {
                ver = substr($0, RSTART, RLENGTH)
                sub(/^#[ \t]*(frozen:[ \t]*)?[vV]?/, "", ver)
              } else {
                ver = $2
                gsub(/["'\'']/, "", ver)
                sub(/^[vV]/, "", ver)
              }
              print ver
              exit
            }
          ' .pre-commit-config.yaml)"
          if [ -z "$UV_VERSION" ]; then
            echo "::error::could not read the astral-sh/uv-pre-commit version from .pre-commit-config.yaml"
            exit 1
          fi
          echo "UV_VERSION=$UV_VERSION" >> "$GITHUB_ENV"
          echo "uv version: $UV_VERSION"

      - name: install uv
        run: python -m pip install "uv==${UV_VERSION}"

      # --all-extras pulls in the optional `lxml` extra, so the expat/lxml
      # line-number parity test actually runs instead of skipping.
      - name: uv sync --locked --all-extras
        run: uv sync --locked --all-extras

      # flags live in [tool.pytest.ini_options] in pyproject.toml, not here
      - name: pytest
        run: uv run --frozen pytest

      # same check as the `inspector-data` pre-commit hook: the generated
      # _inspector_data.py must still match the inspector dumps it came from
      - name: inspector tables match the dumps
        run: uv run --frozen python tools/generate_inspector_data.py --check

      - name: uv build (wheel + sdist)
        run: uv build

      # Exercise the artifact a release would actually ship, not just the
      # source tree: install the wheel into a throwaway venv and import it.
      # The one console script (bigfix-relevance-lint, for a pre-commit hook)
      # gets its own smoke check alongside the import + __version__ (which
      # comes from installed package metadata) check.
      - name: install the built wheel and smoke-import it
        run: |
          uv venv "${RUNNER_TEMP}/wheeltest"
          VIRTUAL_ENV="${RUNNER_TEMP}/wheeltest" uv pip install dist/*.whl
          "${RUNNER_TEMP}/wheeltest/bin/python" -c \
            "import bigfix_relevance_analyzer as m; print(m.__version__)"
          "${RUNNER_TEMP}/wheeltest/bin/bigfix-relevance-lint" --help

      # cheap, and makes a test run's hashes comparable to the released ones
      - name: sha256 of the built artifacts
        run: sha256sum dist/*

  # The shared CodeMirror client and highlighter (src/bigfix_relevance_analyzer/
  # web/) in Node, against tools/editor-client's exact pins of CodeMirror 6 (the
  # versions NiceGUI 3.18 ships, so the oldest supported) and of the TextMate
  # engine the highlighter's parity test runs the VS Code grammar through.
  # Node 22's npm predates `min-release-age`, which is fine for `npm ci`.
  editor-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/editor-client/package-lock.json

      - name: npm ci
        working-directory: tools/editor-client
        run: npm ci

      - name: npm test
        working-directory: tools/editor-client
        run: npm test

  # tools/wasm-common: the browser plumbing shared by the playground and (per
  # #139) the VS Code extension's web server -- pump.js and the jco/esbuild
  # browser flags. No dependencies, so no `npm ci`; node:test only.
  wasm-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: npm test
        working-directory: tools/wasm-common
        run: npm test
