# Config for https://github.com/crate-ci/typos
# Run locally: `uvx typos` (or `pre-commit run typos --all-files`)

[default.extend-words]
# "thead"/"theads" are real BigFix session relevance inspectors (HTML table
# head element / plural), not typos for "thread"/"threads". They show up in
# tests/examples/session_relevance/**.
thead = "thead"
theads = "theads"

# A deliberately garbled name in tests/test_inspectors.py ("wnidows of
# oprating system"), proving lookup() returns nothing for an unknown name
# rather than "correcting" it. .codespellrc carries the matching entries.
wnidows = "wnidows"
oprating = "oprating"

[files]
# tests/examples/ holds real-world BigFix content copied verbatim from
# https://github.com/jgstew/bigfix-content for fidelity (see its README) -
# including whatever typos already exist in that third-party content. Don't
# flag those; fixing them here would misrepresent what was actually copied.
#
# _inspector_data.py is generated from tests/examples/relevance_inspectors/ by
# tools/generate_inspector_data.py - the same verbatim BigFix inspector names,
# just relocated into src/ so the library can read them at runtime. Same
# rationale, same exclusion.
#
# tests/golden/dialect_fit_corpus.json quotes every statement of both corpora,
# tests/examples/ included, verbatim: same rationale, same exclusion.
#
# tests/golden/perf_equivalence.json is hex digests keyed by example file
# names: a digest is not a word, and the names are the verbatim ones above.
#
# tools/batchability/ quotes 545 statements from bigfix-content verbatim, with
# their file names and qna's answers to them (#225): same rationale, and
# "fixing" one would also change what the pinned scores were measured on.
#
# npm lockfiles are generated, and their integrity hashes and truncated
# registry metadata produce false positives that cannot
# be fixed in the file - regenerating it would just bring them back.
# .codespellrc carries the matching exclusion.
extend-exclude = [
    "tests/examples/**",
    "src/bigfix_relevance_analyzer/_inspector_data.py",
    "tests/golden/dialect_fit_corpus.json",
    "tests/golden/perf_equivalence.json",
    "tools/batchability/corpus.jsonl",
    "tools/batchability/outcomes.jsonl",
    "tools/batchability/scores.md",
    "tools/playground-wasm/**/package-lock.json",
    "tools/vscode-extension/**/package-lock.json",
]
