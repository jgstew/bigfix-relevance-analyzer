---
# run on only items staged in git:  pre-commit
# automatically run on commit:      pre-commit install
# check all files in repo:          pre-commit run --all-files
# run the pre-push hooks by hand:   pre-commit run --all-files --hook-stage pre-push
# check all files in repo:          pre-commit run --all-files --hook-stage manual
# update all pre-commit hooks:      pre-commit autoupdate
# https://github.com/pre-commit/pre-commit-hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-private-key
      # Block direct commits to the integration branches; work on a feature
      # branch and open a PR instead. Bypass for a deliberate exception with
      # `git commit --no-verify`.
      # - id: no-commit-to-branch
      #   args: ["--branch=main", "--branch=master"]

  - repo: https://github.com/jgstew/pre-commit-jgstew
    rev: v2.3.0
    hooks:
      - id: fix-files-to-ascii

  # ruff replaces black + flake8 + isort: `ruff-check` lints (and fixes),
  # `ruff-format` is the formatter. Config lives in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: []

  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.36.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        stages: [manual]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
        stages: [manual]
      - id: check-dependabot
        stages: [manual]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    # Find security issues in GitHub Actions CI/CD setups.
    rev: v1.29.0
    hooks:
      - id: zizmor
        # --no-progress is the hook's own default arg and has to be repeated:
        # setting `args` replaces the list, it does not append to it.
        # Online mode has no flag: zizmor runs offline unless it finds a token
        # in GH_TOKEN / GITHUB_TOKEN / ZIZMOR_GITHUB_TOKEN, so export one
        # (`export GH_TOKEN="$(gh auth token)"`) before running this hook to get
        # the online-only audits.

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      - id: uv-lock
      # uv-sync is a post-checkout/post-merge/post-rewrite hook, not a
      # pre-commit one: it re-syncs .venv after a pull or branch switch. It only
      # fires once those hook types are installed:
      #     pre-commit install --hook-type post-checkout --hook-type post-merge
      - id: uv-sync
        args: ["--locked"]
      # Known-vulnerability check against the lock file. `uv audit` is still
      # experimental and needs the network, so it is manual-only rather than
      # blocking every commit.
      - id: uv-audit
        stages: [manual]
        args: ["--preview-features", "audit-command"]

  # Mirrors of what a release run does, so lock drift or a broken build backend
  # pin is caught before the release workflow hits it:
  #     pre-commit run --hook-stage manual uv-lock-check uv-build-wheel
  #
  # These are `stages: [pre-push, manual]` - too slow to want on every `git
  # commit`, but they should still gate code leaving the machine. `manual` has
  # to stay in the list for CI to see them at all: .github/workflows/pre-commit
  # .yaml runs `--hook-stage manual`, and a hook restricted to `[pre-push]`
  # alone is invisible to that. The pre-push half only fires once the hook type
  # is installed:
  #     pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check (uv.lock matches pyproject.toml)
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        entry: uv lock --check
      - id: uv-build-wheel
        name: uv build --wheel (build backend pin works)
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        # built into a temp dir so the repo's own dist/ is not created or stale-filled
        entry: sh -c 'out="$(mktemp -d)"; trap "rm -rf \"$out\"" EXIT; uv build --wheel --out-dir "$out"'
      - id: pytest
        name: pytest (see config in pyproject.toml)
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        entry: uv run --frozen pytest

  - repo: meta
    hooks:
      - id: check-useless-excludes
        stages: [manual]
      - id: check-hooks-apply
        stages: [manual]
