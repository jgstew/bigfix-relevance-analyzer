---
# run on only items staged in git:  pre-commit
# automatically run on commit:      pre-commit install
# check all files in repo:          pre-commit run --all-files
# run the pre-push hooks by hand:   pre-commit run --all-files --hook-stage pre-push
# check all files in repo:          pre-commit run --all-files --hook-stage manual
# update all pre-commit hooks:      pre-commit autoupdate
# https://github.com/pre-commit/pre-commit-hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # A row with no direct-object or index type ends in an empty tab
        # column (see the "Enriched columns" section of this dump's README) --
        # that trailing tab is data, not incidental whitespace to strip. The
        # generated module embeds these dump lines verbatim, so it needs the
        # same exclusion.
        exclude: ^(tests/examples/relevance_inspectors/(session|client)_relevance_properties_(rest_api|ubuntu|debian|rhel|windows|macos)\.txt|src/bigfix_relevance_analyzer/_inspector_data\.py)$
      - id: mixed-line-ending
      - id: detect-private-key
      # Leftover breakpoint()/pdb.set_trace() in a commit.
      - id: debug-statements
      # check-docstring-first is deliberately NOT here: it reports "multiple
      # module docstrings" for the PEP 258 attribute-docstring idiom this
      # codebase uses throughout (a string literal documenting the assignment
      # above it, e.g. MAX_EXPR_DEPTH in diagnostics.py). Sphinx, pdoc, mypy
      # and pyright all understand that form; the hook's AST check does not.
      # Structural guards. None of these have anything to catch today - no
      # submodules, symlinks or executable files are tracked - which is the
      # point: they keep it that way rather than clean up a backlog.
      - id: forbid-submodules
      # check-symlinks is deliberately NOT here: it matches only `type:
      # symlink` files, and with none tracked the meta `check-hooks-apply` hook
      # below (correctly) rejects it as a hook that can never fire.
      # destroyed-symlinks matches every file, so it applies regardless.
      - id: destroyed-symlinks
      - id: check-shebang-scripts-are-executable
      # This project is about Windows-targeted content and carries a
      # filename-heavy example corpus, so a name that cannot be checked out on
      # Windows (CON, PRN, a trailing dot) is a real hazard, not a hypothetical.
      - id: check-illegal-windows-names
      # Comments throughout this repo cite GitHub URLs; a link to a branch
      # rather than a commit rots silently.
      - id: check-vcs-permalinks
      # Every file under tests/ already follows test_*.py; this keeps a new one
      # from being silently skipped by pytest's collection.
      - id: name-tests-test
        args: ["--pytest-test-first"]
      # Block direct commits to the integration branches; work on a feature
      # branch and open a PR instead. Bypass for a deliberate exception with
      # `git commit --no-verify`.
      # - id: no-commit-to-branch
      #   args: ["--branch=main", "--branch=master"]

  # Broader than `detect-private-key` above, which only matches PEM headers:
  # this catches cloud keys, tokens and connection strings too. The repo is
  # public and the example corpus is copied from elsewhere, so a credential
  # arriving with borrowed content is the realistic case. Deferred to pre-push
  # rather than every commit - it scans the whole staged content, not just the
  # diff. Clean on the tree today.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-push, manual]

  - repo: https://github.com/jgstew/pre-commit-jgstew
    rev: a04f4ccc5f9af2d1cda1dd5c519bb3888439648b # v2.3.0
    hooks:
      - id: fix-files-to-ascii

  - repo: https://github.com/jgstew/pre-commit-bigfix
    rev: v1.0.1
    hooks:
      - id: bes-schema-validate
        stages: [pre-push]
      - id: bes-actionscript-lint-schclass
        stages: [pre-push]
      - id: bes-actionscript-validate-script
        stages: [pre-push]
      - id: bes-actionscript-validate-prefetch
        stages: [pre-push]
        # args: [--auto-fix-network, "yes"]
        args: [--disable, "E401"]
      - id: bes-conventions-check
        stages: [pre-push]
        args: [--strict]
        exclude: ^tests/examples/session_relevance/dynamic_javascript/fixlet_description_relevance_via_javascript\.bes$

  # ruff replaces black + flake8 + isort: `ruff-check` lints (and fixes),
  # `ruff-format` is the formatter. Config lives in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682 # v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy is a `local` hook in the repo block near the bottom of this file, not
  # the pre-commit/mirrors-mypy repo hook. See the comment above it for why.

  # Security-focused AST linter for common Python mistakes (hardcoded
  # passwords, shell=True, insecure deserialization, etc.). -lll restricts
  # output to high-severity findings only, so it stays quiet on the low/medium
  # noise (e.g. `assert` in tests) that would otherwise need per-file ignores.
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
    hooks:
      - id: bandit
        args: ["-r", "-lll"]
        files: ^src/

  # Enforces a few Python style rules slyp's author found error-prone in
  # practice (e.g. no bare string-literal concatenation across lines).
  - repo: https://github.com/sirosen/slyp
    rev: 072ea633cef088f143be7c16499d1564485dfc0c # 0.9.0
    hooks:
      - id: slyp

  # Scores the package's distribution metadata (README, classifiers, project
  # URLs, etc.) against packaging best practices. Its own default hook is
  # `always_run: true` on every commit; overridden here to fire only when a
  # file that actually affects that metadata changes. No setup.py/setup.cfg
  # in this repo (hatchling + pyproject.toml only), unlike the upstream
  # example this was adapted from.
  - repo: https://github.com/regebro/pyroma
    rev: dd478a67d029502036973a9f596ec4b2c0614bf7 # 5.0.1
    hooks:
      - id: pyroma
        always_run: false
        files: |
          (?x)^(
              README.md|
              pyproject.toml|
              src/bigfix_relevance_analyzer/__init__.py
          )$
        stages: [manual]

  - repo: https://github.com/crate-ci/typos
    rev: 4d9c206a77c041268485162b8e2579ad7a5cb9a3 # v1.50.0
    hooks:
      - id: typos

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
    hooks:
      - id: codespell

  # Enforces .editorconfig itself, which until now nothing checked - notably
  # the `end_of_line = crlf` rule for .bes files, which BigFix requires inside
  # `actionscript` element text. `mixed-line-ending` above only fires on a file
  # that mixes both endings, so a wholly-LF .bes would have gone through.
  # Config in .editorconfig-checker.json; the exceptions for the verbatim
  # tests/examples/ corpus live in .editorconfig itself.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: e8b4e28241a9ae8296ba6e4a491b5da4eda73283 # 3.11.1
    hooks:
      - id: editorconfig-checker

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # v1.38.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4 # v3.21.2
    hooks:
      - id: pyupgrade
        name: Upgrade Python syntax
        args: [--py311-plus]
        stages: [pre-push, manual]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316 # v1.10.0
    # Pure regex greps, milliseconds to run, so there is nothing to gain from
    # deferring them: at `stages: [manual]` a developer only heard about a
    # blanket `# type: ignore` once CI ran, which is the wrong end of the loop
    # for a one-character fix.
    hooks:
      - id: python-check-blanket-noqa
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: python-no-eval
      - id: python-check-blanket-type-ignore

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3 # 0.26
    hooks:
      - id: validate-pyproject
        stages: [manual]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8 # 0.38.0
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
        stages: [manual]
      - id: check-dependabot
        stages: [manual]

  # The third leg of the workflow-checking stool, and the one that was missing:
  # check-github-workflows (above) validates the schema, zizmor (below) audits
  # security, and neither looks at what the workflows actually *do* - the
  # `${{ }}` expressions, the step/job references, the action input names, and
  # the shell in `run:` blocks (this repo's workflows carry a sizeable
  # hand-written awk program in one). Clean on the tree today.
  #
  # actionlint delegates `run:` block linting to shellcheck and silently skips
  # it when shellcheck is not on PATH - so a developer without it still gets
  # the expression and reference checks, while CI (GitHub runners ship
  # shellcheck) gets the shell checks too. `brew install shellcheck` to get the
  # full check locally.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-push, manual]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    # Find security issues in GitHub Actions CI/CD setups.
    rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce # v1.30.0
    hooks:
      - id: zizmor
        stages: [pre-push, manual]
        # --no-progress is the hook's own default arg and has to be repeated:
        # setting `args` replaces the list, it does not append to it.
        # Online mode has no flag: zizmor runs offline unless it finds a token
        # in GH_TOKEN / GITHUB_TOKEN / ZIZMOR_GITHUB_TOKEN, so export one
        # (`export GH_TOKEN="$(gh auth token)"`) before running this hook
        # locally to get the online-only audits. CI already sets GH_TOKEN to
        # the runner's GITHUB_TOKEN - see .github/workflows/pre-commit.yaml.

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0f34924c4110aca2294a4e4204aac7b3e31803fb # 0.12.7
    hooks:
      - id: uv-lock
      # uv-sync is a post-checkout/post-merge/post-rewrite hook, not a
      # pre-commit one: it re-syncs .venv after a pull or branch switch. It only
      # fires once those hook types are installed:
      #     pre-commit install --hook-type post-checkout --hook-type post-merge
      - id: uv-sync
        args: ["--locked"]
      # Known-vulnerability check against the lock file. `uv audit` is still
      # experimental and needs the network, so it is manual-only rather than
      # blocking every commit.
      - id: uv-audit
        stages: [manual]
        args: ["--preview-features", "audit-command"]

  # Mirrors of what a release run does, so lock drift or a broken build backend
  # pin is caught before the release workflow hits it:
  #     pre-commit run --hook-stage manual uv-lock-check uv-build-wheel
  #
  # These are `stages: [pre-push, manual]` - too slow to want on every `git
  # commit`, but they should still gate code leaving the machine. `manual` has
  # to stay in the list for CI to see them at all: .github/workflows/pre-commit
  # .yaml runs `--hook-stage manual`, and a hook restricted to `[pre-push]`
  # alone is invisible to that. The pre-push half only fires once the hook type
  # is installed:
  #     pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check (uv.lock matches pyproject.toml)
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        entry: uv lock --check
      - id: uv-build-wheel
        name: uv build --wheel (build backend pin works)
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        # built into a temp dir so the repo's own dist/ is not created or stale-filled
        entry: sh -c 'out="$(mktemp -d)"; trap "rm -rf \"$out\"" EXIT; uv build --wheel --out-dir "$out"'
      - id: inspector-data
        name: inspector tables match the dumps
        language: system
        pass_filenames: false
        files: ^(tests/examples/relevance_inspectors/|tools/generate_inspector_data\.py|src/bigfix_relevance_analyzer/_inspector_data\.py)
        entry: uv run python tools/generate_inspector_data.py --check
      - id: reference-prose
        name: embedded reference prose matches docs/reference
        language: system
        pass_filenames: false
        files: ^(docs/reference/|tools/generate_reference_prose\.py|src/bigfix_relevance_analyzer/reference/_prose\.py)
        entry: uv run python tools/generate_reference_prose.py --check
      # pytest-cov and [tool.coverage.run] were already configured but nothing
      # enforced a number. The tree measures 98%; the floor is set at 95 so it
      # is a ratchet against a real regression rather than a wall that fails on
      # a single uncovered branch - same headroom convention as the
      # bigfix-relevance-lint-examples thresholds below.
      - id: pytest
        name: pytest (see config in pyproject.toml)
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        entry: uv run --frozen pytest --cov --cov-fail-under=95
      # Dogfoods lint.py against the package's own example corpus. Scoped to
      # tests/examples/ and to the suffixes extract_relevance_from_file()
      # actually recognizes, minus markdown: the .md examples are documentation
      # prose containing deliberately-broken snippets and bare XML/JS fragments
      # for illustration, not real relevance sites, so the parse-error and
      # unknown-inspector rules would fire on the prose itself rather than a
      # real finding. pre-commit passes only the changed matching files, so
      # this scales with the corpus instead of listing it by hand. Thresholds
      # are set from what the corpus actually scores today (see the PR that
      # added this hook) plus headroom, so this stays a regression guard on
      # genuinely broken content rather than a wall that blocks legitimate
      # examples from growing.
      - id: bigfix-relevance-lint-examples
        name: lint the example corpus (see lint.py)
        language: system
        files: ^tests/examples/.*\.(bes|bes\.xml|ojo|besrpt|beswrpt|webreport|bsr|rel|html?)$
        stages: [pre-push, manual]
        entry: uv run python -m bigfix_relevance_analyzer --check --max-score=550 --max-evaluation-cost=20
      # Run via `uv run` rather than the pre-commit/mirrors-mypy repo hook, for
      # three reasons that all made that hook weaker than it looked:
      #   * mirrors-mypy's own .pre-commit-hooks.yaml sets
      #     `args: [--ignore-missing-imports, --scripts-are-modules]`. Setting
      #     `args` here would replace that list, but not setting it inherits
      #     it - and with missing imports ignored, the `lxml.etree` types in
      #     extract.py degrade to Any and every strict check on that code path
      #     is vacuous.
      #   * its environment is a dependency-less venv, so lxml-stubs (a dev
      #     dependency here) isn't there to ignore in the first place: a
      #     freshly-built one fails on extract.py's `from lxml import etree`.
      #   * it passed filenames, which overrides `files = ["src", "tests"]` in
      #     [tool.mypy] - so tests/ went unchecked, by mypy here and by CI
      #     everywhere (.github/workflows/test.yaml runs pytest and the build,
      #     not mypy).
      # `pass_filenames: false` + `always_run: true` keeps the file set coming
      # from pyproject.toml rather than from whatever happens to be staged.
      # Unlike pyright below, this stays on every commit: the incremental run
      # is about a second.
      - id: mypy
        name: mypy --strict (see config in pyproject.toml)
        language: system
        pass_filenames: false
        always_run: true
        entry: uv run --frozen mypy
      # A second, differently-implemented type checker (same config the editor
      # uses via pyrightconfig.json) as a cross-check on mypy - not a
      # replacement. Deferred to pre-push/CI rather than every commit: it's
      # mostly confirmatory of what mypy --strict already caught, and not worth
      # slowing down every commit for. Run via `uv run` (like the hooks above)
      # rather than the RobertCraigie/pyright-python repo hook so it checks
      # against the project's real, uv-managed .venv - which pyrightconfig.json
      # points at - instead of a separately-managed, dependency-less
      # pre-commit environment that can't resolve lxml/pytest.
      - id: pyright
        name: pyright (see config in pyrightconfig.json)
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
        entry: uv run --frozen pyright

  - repo: meta
    hooks:
      - id: check-useless-excludes
        stages: [manual]
      - id: check-hooks-apply
        stages: [manual]
