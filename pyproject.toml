[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bigfix-relevance-analyzer"
version = "0.1.0"
description = "A python module for working with BigFix Relevance generically. Extract, Analyze, etc."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "JGStew", email = "james@jgstew.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["bigfix", "relevance", "extract", "analyze"]
dependencies = []

[project.optional-dependencies]
# Only for consumers that already parse BES XML with lxml and would rather hand
# over their existing tree than have it parsed a second time. Extraction itself
# uses the standard library, so the package never needs this.
lxml = ["lxml"]

[project.urls]
Homepage = "https://github.com/JGStew/bigfix-relevance-analyzer"
Repository = "https://github.com/JGStew/bigfix-relevance-analyzer"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # So the expat/lxml line-number parity test actually runs instead of skipping.
    "lxml>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "lxml-stubs>=0.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bigfix_relevance_analyzer"]

[tool.uv]
# Delay dependency resolution by 7 days so newly-published (possibly broken
# or compromised) releases aren't picked up immediately.
exclude-newer = "7 days"
required-version = ">=0.12"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true
