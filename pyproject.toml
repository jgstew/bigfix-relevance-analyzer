[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bigfix-relevance-analyzer"
version = "1.11.1"
description = "A python module for working with BigFix Relevance generically. Extract, Analyze, etc."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "JGStew", email = "admin@jgstew.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["bigfix", "relevance", "extract", "analyze"]
dependencies = []

[project.scripts]
# The console script a pre-commit hook's `entry:` calls -- see
# `src/bigfix_relevance_analyzer/_lint_cli.py`. `python -m bigfix_relevance_analyzer`
# stays the only other entry point; this is deliberately the sole addition.
bigfix-relevance-lint = "bigfix_relevance_analyzer._lint_cli:main"

[project.optional-dependencies]
# Only for consumers that already parse BES XML with lxml and would rather hand
# over their existing tree than have it parsed a second time. Extraction itself
# uses the standard library, so the package never needs this.
lxml = ["lxml"]

[project.urls]
Homepage = "https://github.com/JGStew/bigfix-relevance-analyzer"
Repository = "https://github.com/JGStew/bigfix-relevance-analyzer"

[dependency-groups]
# The componentize-py toolchain, kept out of `dev` because it is only ever
# needed by .github/workflows/wasm-html.yaml and pulls a 15 MiB binary wheel that
# embeds a whole CPython-for-WASI build. Pinned exactly: the version decides
# which CPython ends up inside the component, and
# tools/playground-wasm/componentize-py/build-playground/build_playground.py
# cross-checks this pin against its own so the two cannot drift.
wasm = ["componentize-py==0.25.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # So the expat/lxml line-number parity test actually runs instead of skipping.
    "lxml>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyright>=1.1.400",
    "pre-commit>=3.8",
    "lxml-stubs>=0.5.1",
    # Evaluates client relevance across containers, SSH endpoints and the local
    # agent, on pinned qna versions -- the multi-client oracle `docs/qna.md`
    # sends you to when a question's answer depends on which client answers it.
    "bigfix-remote-client-relevance>=1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bigfix_relevance_analyzer"]

[tool.uv]
# Delay dependency resolution by 7 days so newly-published (possibly broken
# or compromised) releases aren't picked up immediately.
exclude-newer = "7 days"
# One deliberate exception, narrowed to a single name so the policy above still
# covers everything else. `bigfix-remote-client-relevance` is this project's own
# multi-client qna oracle (see `docs/qna.md`); every release of it so far is
# newer than the cutoff, so the rule would exclude the package entirely rather
# than merely hold it back. Remove this entry once its releases age past the
# window on their own.
exclude-newer-package = { bigfix-remote-client-relevance = "2026-09-01T00:00:00Z" }
required-version = ">=0.12"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Generated by tools/generate_inspector_data.py. Its long lines are verbatim
# inspector signatures, not code that could be wrapped, and a row's trailing
# tab is a meaningful empty enrichment column (see inspectors.py), not stray
# whitespace to strip.
"src/bigfix_relevance_analyzer/_inspector_data.py" = ["E501", "W291"]
# Generated by tools/generate_reference_prose.py. One `repr` per document, so
# every line is an entire Markdown file -- nothing that could be wrapped, and
# wrapping it would corrupt the prose the module exists to carry.
"src/bigfix_relevance_analyzer/reference/_prose.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true
